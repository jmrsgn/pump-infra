apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-mongo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pump-mongo
  template:
    metadata:
      labels:
        app: pump-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
