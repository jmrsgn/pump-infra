apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-coaching-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pump-coaching-service
  template:
    metadata:
      labels:
        app: pump-coaching-service
    spec:
      containers:
        - name: pump-coaching-service
          image: ghcr.io/jmrsgn/pump-coaching-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

          env:
            - name: SPRING_PROFILES_ACTIVE
              value: k8s

            # DB
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://pump-postgres:5432/pump_coaching_db

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: POSTGRES_USER

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: POSTGRES_PASSWORD

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: JWT_SECRET

            - name: JWT_EXPIRATION
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: JWT_EXPIRATION

            - name: PUMP_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: PUMP_INTERNAL_SERVICE_TOKEN

            # EXTERNAL URLS
            - name: SOCIAL_BASE_URL
              value: http://pump-social-service:8080

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 10

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
