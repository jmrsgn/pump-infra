apiVersion: apps/v1
kind: Deployment
metadata:
  name: pump-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pump-postgres
  template:
    metadata:
      labels:
        app: pump-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pump-secrets
                  key: POSTGRES_PASSWORD