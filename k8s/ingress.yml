apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pump-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: pump.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pump
                port:
                  number: 8080

    - host: auth.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pump-auth-service
                port:
                  number: 8080
